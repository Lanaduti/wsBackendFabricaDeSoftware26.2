<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VVCC — Você Votando Certo e com Consciência</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Space+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary-navy: #0b1b3d;
      --accent-green: #00a86b;
      --accent-gold: #ffb703;
      --bg-overlay: rgba(11, 27, 61, 0.92);
      --card-bg: rgba(255, 255, 255, 0.96);
      --text-dark: #1e293b;
      --text-muted: #64748b;
    }

    * { box-sizing: border-box; }

    body { 
      font-family: 'Inter', sans-serif; 
      margin: 0; padding: 0;
      background: linear-gradient(var(--bg-overlay), var(--bg-overlay)), 
                  url('https://images.unsplash.com/photo-1541872703-74c5e44368f9?q=80&w=1600&auto=format&fit=crop') center/cover fixed no-repeat;
      color: #fff;
      min-height: 100vh;
    }

    /* ANIMACAO ESTILO NETFLIX (SPLASH SCREEN) */
    #splash-screen {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: var(--primary-navy);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      animation: fadeOut 0.8s ease-in-out 2.2s forwards;
    }

    .splash-logo {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 72px;
      font-weight: 800;
      letter-spacing: 6px;
      background: linear-gradient(90deg, #ffffff, var(--accent-gold));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: zoomIn 1.5s cubic-bezier(0.215, 0.610, 0.355, 1.000) forwards;
    }

    .splash-sub {
      color: #cbd5e1;
      font-size: 16px;
      margin-top: 10px;
      opacity: 0;
      animation: fadeIn 1s ease-in 0.8s forwards;
    }

    @keyframes zoomIn {
      0% { opacity: 0; transform: scale(0.3); }
      50% { opacity: 1; transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    @keyframes fadeIn { to { opacity: 1; } }
    @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }

    /* LAYOUT DA PAGINA DE ENTRADA / AUTH */
    #auth-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .auth-card {
      background: var(--card-bg);
      color: var(--text-dark);
      border-radius: 20px;
      padding: 40px;
      max-width: 480px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    .auth-header { text-align: center; margin-bottom: 25px; }
    .auth-header h2 { color: var(--primary-navy); font-family: 'Space Grotesk', sans-serif; margin: 10px 0 5px; }

    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; color: var(--text-dark); }
    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 14px;
    }

    .btn-submit {
      width: 100%;
      background: var(--accent-green);
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-submit:hover { background: #008f5a; }

    .auth-toggle {
      text-align: center;
      margin-top: 15px;
      font-size: 13px;
      color: var(--text-muted);
    }
    .auth-toggle a { color: var(--primary-navy); font-weight: 700; text-decoration: none; cursor: pointer; }

    /* PAINEL PRINCIPAL (ESCONDIDO ATE LOGAR) */
    #main-app { display: none; }

    .top-bar {
      background: rgba(11, 27, 61, 0.95);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 12px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0; z-index: 100;
    }

    .btn-logout {
      background: #ef4444;
      color: white;
      border: none;
      padding: 8px 16px;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
    }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); gap: 25px; }
    .card { background: #fff; padding: 20px; border-radius: 16px; color: var(--text-dark); }
    .card img { width: 100%; height: 240px; object-fit: cover; border-radius: 12px; }
  </style>
</head>
<body>

  <!-- 1. SPLASH SCREEN (ANIMACAO INICIAL) -->
  <div id="splash-screen">
    <div class="splash-logo">VVCC</div>
    <div class="splash-sub">Você Votando Certo e com Consciência</div>
  </div>

  <!-- 2. TELA DE AUTENTICACAO OBRIGATORIA (LOGIN / CADASTRO) -->
  <div id="auth-container">
    <div class="auth-card">
      <div class="auth-header">
        <span style="font-family:'Space Grotesk'; font-weight:800; font-size:28px; color:var(--primary-navy);">🗳️ VVCC</span>
        <h2 id="form-title">Acesse sua Conta</h2>
        <p style="font-size:13px; color:var(--text-muted);">Acompanhe a atuação dos parlamentares e fiscalize os gastos públicos.</p>
      </div>

      <!-- FORMULARIO DE LOGIN -->
      <form id="login-form" onsubmit="efetuarLogin(event)">
        <div class="form-group">
          <label>E-mail</label>
          <input type="email" id="login-email" required placeholder="seu@email.com">
        </div>
        <div class="form-group">
          <label>Senha</label>
          <input type="password" id="login-senha" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn-submit">Entrar no Sistema</button>
        
        <div class="auth-toggle">
          <a onclick="esqueciSenha()">Esqueci minha senha</a><br><br>
          Não possui uma conta? <a onclick="mostrarCadastro()">Cadastre-se</a>
        </div>
      </form>

      <!-- FORMULARIO DE CADASTRO -->
      <form id="register-form" style="display:none;" onsubmit="efetuarCadastro(event)">
        <div class="form-group">
          <label>Nome Completo</label>
          <input type="text" id="reg-nome" required placeholder="Ex: Maria Silva">
        </div>
        <div class="form-group">
          <label>Apelido (Como quer ser chamado)</label>
          <input type="text" id="reg-apelido" placeholder="Ex: Mari">
        </div>
        <div class="form-group">
          <label>E-mail</label>
          <input type="email" id="reg-email" required placeholder="seu@email.com">
        </div>
        <div class="form-group">
          <label>Confirmar E-mail</label>
          <input type="email" id="reg-email-conf" required placeholder="Repita o e-mail">
        </div>
        <div class="form-group">
          <label>Data de Nascimento (Mínimo 16 anos)</label>
          <input type="date" id="reg-nascimento" required>
        </div>
        <div class="form-group">
          <label>Senha (Mín. 8 caracteres, 1 maiúscula e 1 símbolo)</label>
          <input type="password" id="reg-senha" required placeholder="••••••••">
        </div>
        <div class="form-group">
          <label>Confirmar Senha</label>
          <input type="password" id="reg-senha-conf" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn-submit">Criar Minha Conta</button>
        
        <div class="auth-toggle">
          Já tem conta? <a onclick="mostrarLogin()">Fazer Login</a>
        </div>
      </form>
    </div>
  </div>

  <!-- 3. PAINEL PRINCIPAL DO SITE (LIBERADO APOS LOGIN) -->
  <div id="main-app">
    <div class="top-bar">
      <span style="font-weight: 800; font-family: 'Space Grotesk'; font-size: 18px;">🗳️ VVCC</span>
      <div style="display:flex; align-items:center; gap:15px;">
        <span id="user-display"></span>
        <button class="btn-logout" onclick="efetuarLogout()">Sair</button>
      </div>
    </div>

    <main style="max-width:1200px; margin:0 auto; padding:30px 20px;">
      <section style="background:var(--card-bg); color:var(--text-dark); padding:30px; border-radius:16px; margin-bottom:30px;">
        <h2 style="font-family:'Space Grotesk'; color:var(--primary-navy);">🏛️ Deputados Federais por Estado</h2>
        <div id="deputados-grid" class="grid">Carregando parlamentares...</div>
      </section>
    </main>
  </div>

  <script>
    // LOGICA DE SESSAO NO FRONTEND
    window.onload = function() {
      const token = localStorage.getItem('vvcc_token');
      const user = localStorage.getItem('vvcc_user');
      if (token && user) {
        exibirApp(user);
      }
    };

    function mostrarCadastro() {
      document.getElementById('login-form').style.display = 'none';
      document.getElementById('register-form').style.display = 'block';
      document.getElementById('form-title').innerText = 'Criar Nova Conta';
    }

    function mostrarLogin() {
      document.getElementById('register-form').style.display = 'none';
      document.getElementById('login-form').style.display = 'block';
      document.getElementById('form-title').innerText = 'Acesse sua Conta';
    }

    function esqueciSenha() {
      alert("Para redefinir sua senha, entre em contato com o suporte ou aguarde a integração com o serviço de e-mail.");
    }

    // VALIDACOES DE CADASTRO E REQUISICAO API
    async function efetuarCadastro(e) {
      e.preventDefault();

      const nome = document.getElementById('reg-nome').value;
      const apelido = document.getElementById('reg-apelido').value;
      const email = document.getElementById('reg-email').value;
      const emailConf = document.getElementById('reg-email-conf').value;
      const nascimento = document.getElementById('reg-nascimento').value;
      const senha = document.getElementById('reg-senha').value;
      const senhaConf = document.getElementById('reg-senha-conf').value;

      // Validacao de E-mail
      if (email !== emailConf) {
        alert("Os e-mails informados não coincidem!");
        return;
      }

      // Validacao de Senha
      if (senha !== senhaConf) {
        alert("As senhas informadas não coincidem!");
        return;
      }

      const regexSenha = /^(?=.*[A-Z])(?=.*[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]).{8,}$/;
      if (!regexSenha.test(senha)) {
        alert("A senha deve ter pelo menos 8 dígitos, conter no mínimo uma letra maiúscula e um caractere especial!");
        return;
      }

      // Validacao de Idade (Mínimo 16 anos)
      const dataNasc = new Date(nascimento);
      const hoje = new Date();
      let idade = hoje.getFullYear() - dataNasc.getFullYear();
      const m = hoje.getMonth() - dataNasc.getMonth();
      if (m < 0 || (m === 0 && hoje.getDate() < dataNasc.getDate())) { idade--; }

      if (idade < 16) {
        alert("Acesso negado: É necessário ter pelo menos 16 anos para se cadastrar.");
        return;
      }

      // Envio para o Backend Django
      try {
        const response = await fetch('http://127.0.0.1:8000/api/cadastrar/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: email,
            email: email,
            nome: nome,
            apelido: apelido,
            data_nascimento: nascimento,
            password: senha
          })
        });

        if (response.ok) {
          alert("Cadastro realizado com sucesso! Faça login para continuar.");
          mostrarLogin();
        } else {
          const err = await response.json();
          alert("Erro no cadastro: " + JSON.stringify(err));
        }
      } catch (err) {
        alert("Erro na conexão com o servidor.");
      }
    }

    async function efetuarLogin(e) {
      e.preventDefault();
      const email = document.getElementById('login-email').value;
      const senha = document.getElementById('login-senha').value;

      try {
        const response = await fetch('http://127.0.0.1:8000/api/login/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: email, password: senha })
        });

        if (response.ok) {
          const data = await response.json();
          localStorage.setItem('vvcc_token', data.token);
          localStorage.setItem('vvcc_user', email);
          exibirApp(email);
        } else {
          alert("E-mail ou senha inválidos.");
        }
      } catch (err) {
        alert("Erro ao conectar com o servidor.");
      }
    }

    function exibirApp(username) {
      document.getElementById('auth-container').style.display = 'none';
      document.getElementById('main-app').style.display = 'block';
      document.getElementById('user-display').innerText = `Olá, ${username}`;
      carregarDeputados();
    }

    function efetuarLogout() {
      localStorage.removeItem('vvcc_token');
      localStorage.removeItem('vvcc_user');
      document.getElementById('main-app').style.display = 'none';
      document.getElementById('auth-container').style.display = 'flex';
      mostrarLogin();
    }

    async function carregarDeputados() {
      const grid = document.getElementById("deputados-grid");
      try {
        let res = await fetch('https://dadosabertos.camara.leg.br/api/v2/deputados?siglaUf=PB&itens=12&ordem=ASC&ordenarPor=nome');
        let data = await res.json();
        grid.innerHTML = "";
        data.dados.forEach(dep => {
          grid.innerHTML += `
            <div class="card">
              <img src="${dep.urlFoto}" alt="${dep.nome}">
              <h3>${dep.nome}</h3>
              <p>${dep.siglaPartido} - ${dep.siglaUf}</p>
            </div>
          `;
        });
      } catch (err) {
        grid.innerHTML = "<p>Erro ao carregar deputados.</p>";
      }
    }
  </script>
</body>
</html>
